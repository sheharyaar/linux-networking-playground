# A throwaway three-node kind cluster for the Maglev chapter. Its own name, so it never
# touches another cluster. No kube-proxy and no default CNI: Cilium replaces both.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: qbbr-maglev
networking:
  disableDefaultCNI: true
  kubeProxyMode: none
nodes:
  - role: control-plane
  - role: worker
  - role: worker
